dataset:
  repo_id: conveyor-defect-rejection
  root: /home/nabi/LIBERO/lerobot_dataset
  use_imagenet_stats: true
  video_backend: pyav

policy:
  type: smolvla
  pretrained_path: me-nabi/smolvla-libero-100k-final
  device: cuda
  chunk_size: 50
  n_action_steps: 50
  train_expert_only: true
  freeze_vision_encoder: true
  train_state_proj: true
  num_vlm_layers: 16
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  push_to_hub: false

output_dir: /home/nabi/LIBERO/training_output/smolvla_conveyor
steps: 10000
batch_size: 2
num_workers: 2
log_freq: 100
save_freq: 2500
save_checkpoint: true
env_eval_freq: 0
seed: 42

optimizer:
  type: adam
  lr: 0.0001
  betas: [0.9, 0.95]
  eps: 1.0e-08
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  num_decay_steps: 9500
  peak_lr: 0.0001
  decay_lr: 2.5e-06

wandb:
  enable: false
